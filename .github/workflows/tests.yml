name: Tests

# Corre los tests con pygame de verdad (sin ventana) en cada pull request y en main.
# Los tests que necesitan pygame se saltean solos en una máquina sin pygame; acá no.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy   # pygame sin ventana
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Comprobar que pygame funciona (si no, los tests se saltearían en silencio)
        run: python -c "import pygame; print('pygame', pygame.version.ver, 'SDL', pygame.version.SDL)"

      - name: Validar salas y diálogos
        run: |
          python -m rooms.layout
          python -m dialogue.lines

      - name: Tests (incluye una partida de humo sin ventana)
        run: python -m unittest discover -s tests -v

  godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Godot 4.7.2
        run: |
          curl --fail --location --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64

      - name: Importar proyecto Godot
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path godot --quit

      - name: Tests Godot y smoke de dibujo
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/run_tests.gd
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/smoke_room_draw.gd
